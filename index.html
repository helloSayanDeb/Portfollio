<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sayan Deb | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-black: #000000;
        --bg-dark: #050505;
        --bg-card: #0a0a0a;
        --text-white: #ffffff;
        --text-muted: #737373;
        --text-dark: #171717;
        
        --border-light: rgba(255, 255, 255, 0.1);
        --border-hover: rgba(255, 255, 255, 0.3);
        
        --font-sans: 'DM Sans', sans-serif;
        --font-display: 'Syne', sans-serif;
      }

      body {
        background-color: var(--bg-black);
        color: var(--text-white);
        font-family: var(--font-sans);
        overflow-x: hidden;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
      }
      
      * {
        box-sizing: border-box;
      }
      
      /* Utilities */
      .flex { display: flex; }
      .flex-col { flex-direction: column; }
      .items-center { align-items: center; }
      .justify-center { justify-content: center; }
      .justify-between { justify-content: space-between; }
      .absolute { position: absolute; }
      .relative { position: relative; }
      .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
      .w-full { width: 100%; }
      .h-full { height: 100%; }
      .z-0 { z-index: 0; }
      .z-10 { z-index: 10; }
      .z-50 { z-index: 50; }
      .pointer-events-none { pointer-events: none; }
      .pointer-events-auto { pointer-events: auto; }
      .cursor-pointer { cursor: pointer; }
      .text-center { text-align: center; }
      .uppercase { text-transform: uppercase; }
      .hidden { display: none; }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #000; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

      /* App Container */
      .app-root {
        background-color: var(--bg-black);
        min-height: 100vh;
      }

      .scroll-container {
        height: 100vh;
        width: 100%;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .bg-gradient-main {
        background: linear-gradient(135deg, #1a1a1a, #050505, #000);
      }

      /* Hero Section */
      .hero-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 60vw;
        height: 60vw;
        background: rgba(23, 23, 23, 0.4);
        border-radius: 50%;
        filter: blur(120px);
        mix-blend-mode: screen;
        pointer-events: none;
      }

      .hero-content {
        transform: translateY(-3rem);
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      .hero-title {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 16vw;
        line-height: 0.8;
        letter-spacing: -0.05em;
        color: transparent;
        background: linear-gradient(to bottom, #737373, #262626, #000);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-stroke: 1px rgba(255,255,255,0.1);
        filter: drop-shadow(0 0 40px rgba(0,0,0,0.8));
        margin: 0;
      }

      .hero-subtitle-container {
        margin-top: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        opacity: 0.8;
        width: 100%;
        max-width: 42rem;
      }

      .hero-line {
        height: 1px;
        width: 1.5rem;
        background: linear-gradient(to right, transparent, #737373, transparent);
        flex-shrink: 0;
      }

      .hero-subtitle {
        color: var(--text-muted);
        letter-spacing: 0.2em;
        font-size: 10px;
        font-weight: 500;
        text-transform: uppercase;
        white-space: nowrap;
      }

      @media (min-width: 768px) {
        .hero-subtitle-container { gap: 1.5rem; margin-top: 2.5rem; }
        .hero-line { width: 8rem; }
        .hero-subtitle { letter-spacing: 0.5em; font-size: 0.875rem; }
      }

      /* 3D Cards */
      .perspective-container {
        perspective: 1800px;
        transform-style: preserve-3d;
      }

      .card-wrapper {
        position: absolute;
        width: 75vw;
        height: 55vh;
        will-change: transform;
      }

      .card-3d {
        transform-style: preserve-3d;
        backface-visibility: hidden;
      }

      .card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        background-color: var(--bg-card);
        border-left: 1px solid var(--border-light);
        border-top: 1px solid var(--border-light);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: border-color 0.3s ease, transform 0.3s ease;
      }

      .card-wrapper:hover .card-inner {
        border-color: var(--border-hover);
        transform: scale(1.02);
      }

      .brushed-metal {
        background-image: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(255, 255, 255, 0.02) 2px,
          rgba(255, 255, 255, 0.02) 4px
        );
        box-shadow: 
          inset 1px 1px 0 0 rgba(255,255,255,0.15),
          inset -1px -1px 0 0 rgba(0,0,0,0.8),
          10px 10px 30px -5px rgba(0,0,0,0.8);
      }

      .card-sweep {
        position: absolute;
        inset: 0;
        background: linear-gradient(to top right, transparent, rgba(255,255,255,0.05), transparent);
        transform: translateX(-100%);
        transition: transform 0.7s ease-in-out;
        z-index: 20;
        pointer-events: none;
      }

      .card-wrapper:hover .card-sweep {
        transform: translateX(100%);
      }

      .card-content {
        position: relative;
        z-index: 10;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        height: 100%;
        justify-content: space-between;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }

      .card-version {
        font-family: monospace;
        font-size: 10px;
        color: var(--text-muted);
        letter-spacing: 0.1em;
        border: 1px solid var(--border-light);
        padding: 0.25rem 0.5rem;
        background: rgba(0,0,0,0.4);
        backdrop-filter: blur(4px);
      }

      .card-number {
        font-family: var(--font-display);
        font-size: 1.875rem;
        font-weight: 700;
        color: #262626; 
      }

      .card-title {
        font-family: var(--font-display);
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-white);
        line-height: 1.25;
        margin: 0 0 0.5rem 0;
        transition: color 0.3s;
      }

      .card-wrapper:hover .card-title {
        color: #e5e5e5;
      }

      .card-desc {
        font-size: 0.75rem;
        color: #a3a3a3;
        line-height: 1.625;
        margin: 0;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .card-footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-top: 1px solid rgba(255,255,255,0.05);
        padding-top: 1rem;
        margin-top: 0.5rem;
      }

      .tech-dots {
        display: flex;
        gap: 0.5rem;
      }

      .tech-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #404040;
        transition: background-color 0.3s;
      }

      .card-wrapper:hover .tech-dot {
        background-color: var(--text-white);
      }

      .card-btn {
        width: 2rem;
        height: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--border-light);
        color: var(--text-white);
        transition: all 0.3s;
        cursor: pointer;
        padding: 0;
      }

      .card-btn:hover {
        background: var(--text-white);
        color: var(--bg-black);
      }
      
      .card-btn svg {
        transition: transform 0.3s;
      }
      
      .card-btn:hover svg {
        transform: rotate(45deg);
      }

      @media (min-width: 768px) {
        .card-wrapper { width: 320px; height: 460px; }
        .card-content { padding: 2rem; }
        .card-version { font-size: 0.75rem; }
        .card-number { font-size: 2.25rem; }
        .card-title { font-size: 1.875rem; }
        .card-desc { font-size: 0.875rem; }
        .card-footer { padding-top: 1.5rem; }
        .tech-dot { width: 8px; height: 8px; }
        .card-btn { width: 2.5rem; height: 2.5rem; }
      }

      /* Scroll Indicator */
      .scroll-indicator {
        position: absolute;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        opacity: 0.4;
        z-index: 0;
      }

      .scroll-line {
        width: 1px;
        height: 2rem;
        background: linear-gradient(to bottom, transparent, white, transparent);
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .scroll-text {
        font-size: 9px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .5; }
      }

      @media (min-width: 768px) {
        .scroll-indicator { bottom: 2.5rem; }
        .scroll-line { height: 3rem; }
        .scroll-text { font-size: 10px; }
      }

      /* Footer */
      .footer {
        position: relative;
        z-index: 10;
        background-color: var(--bg-dark);
        border-top: 1px solid var(--border-light);
        padding: 3rem 1.5rem;
      }

      .footer-container {
        max-width: 80rem;
        margin: 0 auto;
      }

      .footer-top {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3rem;
        text-align: center;
      }
      
      .footer-content-left {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        width: 100%;
        max-width: 30rem;
      }

      .footer-heading {
        font-family: var(--font-display);
        font-size: 1.875rem;
        font-weight: 700;
        color: var(--text-white);
        margin: 0;
      }

      .footer-desc {
        color: var(--text-muted);
        font-size: 0.875rem;
        margin: 0;
        line-height: 1.6;
      }

      .footer-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.875rem 2rem;
        background-color: var(--text-white);
        color: var(--bg-black);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.025em;
        text-decoration: none;
        transition: background-color 0.2s;
        font-size: 0.875rem;
        margin-top: 0.5rem;
      }

      .footer-btn:hover {
        background-color: #e5e5e5;
      }

      .footer-socials {
        display: flex;
        gap: 1rem;
      }

      .social-link {
        width: 3rem;
        height: 3rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border-light);
        color: #a3a3a3;
        background-color: var(--bg-card);
        position: relative;
        overflow: hidden;
        transition: all 0.3s;
        text-decoration: none;
      }

      .social-link:hover {
        color: var(--text-white);
        border-color: var(--text-white);
      }

      .social-hover {
        position: absolute;
        inset: 0;
        background: rgba(255,255,255,0.1);
        transform: translateY(100%);
        transition: transform 0.3s;
      }

      .social-link:hover .social-hover {
        transform: translateY(0);
      }

      .footer-bottom {
        max-width: 80rem;
        margin: 3rem auto 0;
        padding-top: 2rem;
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: center;
        text-align: center;
        color: #525252;
        font-size: 0.75rem;
      }

      @media (min-width: 768px) {
        .footer { padding: 5rem 2rem; }
        .footer-top { 
            flex-direction: row; 
            justify-content: space-between; 
            align-items: flex-start;
            text-align: left; 
        }
        .footer-content-left {
            align-items: flex-start;
            text-align: left;
            max-width: 40%;
        }
        .footer-heading { font-size: 2.5rem; }
        .footer-desc { font-size: 1rem; }
        .footer-btn { padding: 1rem 2.5rem; font-size: 0.9rem; margin-top: 1rem; }
        .footer-socials { gap: 1rem; }
        .social-link { width: 3.5rem; height: 3.5rem; }
        .footer-bottom { flex-direction: row; justify-content: space-between; font-size: 0.875rem; }
      }

      /* Modal */
      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }

      .modal-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
      }

      .modal-container {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--bg-card);
        overflow-y: auto;
        transform-style: preserve-3d;
        opacity: 0;
        /* Brushed metal effect for modal */
        background-image: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(255, 255, 255, 0.02) 2px,
          rgba(255, 255, 255, 0.02) 4px
        );
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      }

      .modal-glare {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 20;
        background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.05) 45%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 55%, transparent 60%);
        background-size: 200% 100%;
      }

      .modal-close {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 50;
        padding: 0.5rem;
        background: rgba(0,0,0,0.5);
        border: 1px solid var(--border-light);
        border-radius: 9999px;
        color: var(--text-white);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }

      .modal-close:hover {
        background: var(--text-white);
        color: var(--bg-black);
      }

      .modal-layout {
        display: flex;
        flex-direction: column;
        min-height: 100%;
      }

      .modal-left {
        width: 100%;
        padding: 1.5rem;
        border-bottom: 1px solid var(--border-light);
        background: linear-gradient(to bottom, #111, #0a0a0a);
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        position: relative;
        z-index: 10;
      }
      
      .metal-edge {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 1px;
        background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
      }

      .modal-meta {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }

      .meta-tag {
        font-family: monospace;
        font-size: 10px;
        color: #a3a3a3;
        border: 1px solid var(--border-light);
        padding: 0.125rem 0.5rem;
      }

      .modal-title {
        font-family: var(--font-display);
        font-size: 1.875rem;
        font-weight: 700;
        line-height: 1.1;
        margin: 0 0 1rem 0;
        color: var(--text-white);
        text-shadow: 0 0 20px rgba(255,255,255,0.1);
      }

      .modal-desc {
        font-size: 1rem;
        color: #a3a3a3;
        line-height: 1.625;
        margin: 0;
      }

      .modal-tech-title {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-muted);
        margin: 0 0 0.75rem 0;
      }

      .tech-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .tech-tag {
        padding: 0.25rem 0.5rem;
        background: #151515;
        border: 1px solid rgba(255,255,255,0.05);
        color: #d4d4d4;
        font-size: 0.75rem;
        transition: border-color 0.2s;
      }
      
      .tech-tag:hover {
        border-color: rgba(255,255,255,0.2);
      }

      .modal-right {
        width: 100%;
        padding: 1.5rem;
        background: #050505;
        position: relative;
        overflow: hidden;
        padding-bottom: 5rem;
      }
      
      .grid-bg {
        position: absolute;
        inset: 0;
        opacity: 0.1;
        background-image: radial-gradient(circle, #333 1px, transparent 1px);
        background-size: 30px 30px;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
        margin-bottom: 1.5rem;
        position: relative;
        z-index: 10;
      }

      .stat-card {
        padding: 0.75rem;
        border: 1px solid rgba(255,255,255,0.05);
        background: #0a0a0a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .stat-value {
        font-family: var(--font-display);
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--text-white);
        margin-bottom: 0.25rem;
      }

      .stat-label {
        font-size: 10px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .features-title {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-muted);
        margin: 1rem 0 0.5rem 0;
        position: relative;
        z-index: 10;
      }

      .features-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
        position: relative;
        z-index: 10;
      }

      .feature-item {
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
        padding: 0.75rem;
        border: 1px solid rgba(255,255,255,0.05);
        background: rgba(10,10,10,0.5);
        transition: border-color 0.2s;
      }

      .feature-item:hover {
        border-color: rgba(255,255,255,0.2);
      }

      .feature-icon {
        margin-top: 0.25rem;
        color: rgba(255,255,255,0.5);
      }

      .feature-text h5 {
        color: var(--text-white);
        font-size: 0.875rem;
        font-weight: 500;
        margin: 0 0 0.25rem 0;
      }

      .feature-text p {
        font-size: 10px;
        color: var(--text-muted);
        margin: 0;
      }

      .modal-cta {
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        justify-content: flex-end;
        position: relative;
        z-index: 10;
      }

      .cta-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        width: 100%;
        padding: 0.75rem 1.25rem;
        background: var(--text-white);
        color: var(--bg-black);
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.875rem;
        border: none;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .cta-btn:hover {
        background-color: #e5e5e5;
      }
      
      .cta-btn svg { transition: transform 0.3s; }
      .cta-btn:hover svg { transform: rotate(45deg); }

      @media (min-width: 768px) {
        .modal-overlay { padding: 2rem; }
        .modal-container { max-width: 72rem; height: 90vh; border: 1px solid var(--border-light); }
        .modal-close { position: absolute; top: 1.5rem; right: 1.5rem; border-radius: 0; }
        .modal-layout { flex-direction: row; }
        .modal-left { width: 33.333%; padding: 3rem; border-bottom: 0; border-right: 1px solid var(--border-light); }
        .modal-meta { margin-bottom: 1rem; }
        .meta-tag { font-size: 0.75rem; }
        .modal-title { font-size: 3rem; margin-bottom: 1.5rem; }
        .modal-desc { font-size: 1.125rem; }
        .modal-tech-title { font-size: 0.875rem; }
        .tech-tag { padding: 0.375rem 0.75rem; font-size: 0.875rem; }
        
        .modal-right { width: 66.666%; padding: 3rem; padding-bottom: 3rem; }
        .stats-grid { grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { padding: 1rem; }
        .stat-value { font-size: 1.875rem; }
        .stat-label { font-size: 0.75rem; }
        
        .features-grid { grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
        .feature-item { gap: 1rem; padding: 1rem; }
        .feature-text h5 { font-size: 1rem; }
        .feature-text p { font-size: 0.75rem; }
        
        .modal-cta { margin-top: 3rem; padding-top: 2rem; }
        .cta-btn { width: auto; font-size: 1rem; padding: 0.75rem 1.5rem; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
